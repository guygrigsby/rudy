name: cla
# pull_request_target, because a pull request from a fork runs with no write token and
# this job has to record a signature. It is safe here only because the job never checks
# out or runs the pull request's code: it reads comments and writes a JSON file.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/guygrigsby/rudy/blob/main/CLA.md
          # The signatures live on their own branch: a merge is a code change and a
          # signature is not, and main's history stays one of those two things.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          allowlist: guygrigsby,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Rudy is AGPL-3.0-or-later and also licensed
            commercially, which is why it asks for a CLA before a first contribution:
            without one your work cannot ship in a commercially licensed build. You keep
            the copyright in what you wrote. Read [the CLA](https://github.com/guygrigsby/rudy/blob/main/CLA.md),
            and if you agree, comment exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "CLA signed. Thanks."
