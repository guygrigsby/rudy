name: ci
on:
  push:
  pull_request:
jobs:
  check:
    # Both, because the socket transport has a darwin half and a linux half
    # (unixsock_darwin.go, unixsock_linux.go) and only one of them ever runs on a laptop.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The linter is installed, not run, here: `make check` is the one definition of the
      # gate (CLAUDE.md) and runs it itself. golangci-lint-action v8 dropped install-only
      # and lints on its own.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make check
