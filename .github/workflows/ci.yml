name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The linter is installed, not run, here: `make check` is the one definition of the
      # gate (CLAUDE.md) and runs it itself. golangci-lint-action v8 dropped install-only
      # and lints on its own.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make check
